<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Last-Safe-Moment Engine</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">Last-Safe-<span>Moment</span> Engine</div>
    <div class="login-tag">Don't just predict failure. Find the last safe moment to act.</div>

    <div class="err-box" id="login-error"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input class="form-control" type="email" id="email" placeholder="admin@example.com" required value="admin@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input class="form-control" type="password" id="password" placeholder="••••••••" required value="admin123">
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="remember"> <label for="remember">Remember me</label>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="login-btn">Login</button>
    </form>

    <div class="demo-note">
      <b>Demo credentials</b><br>
      Email: admin@example.com &nbsp;|&nbsp; Password: admin123
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>initLoginPage();</script>
</body>
</html>
